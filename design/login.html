<!doctype html>
<html data-theme="autumn">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restic Monitor</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />

</head>

<body>
    <header>

        <div class="drawer">
            <input id="my-drawer-2" type="checkbox" class="drawer-toggle lg:hidden" />
            <div class="drawer-content flex flex-col">
                <!-- Navbar -->
                <div class="navbar bg-base-100 shadow-sm w-full">
                    <div class="flex-none lg:hidden">
                        <label for="my-drawer-2" aria-label="open sidebar"
                            class="btn btn-square btn-ghost drawer-button">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                class="inline-block h-6 w-6 stroke-current">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M4 6h16M4 12h16M4 18h16"></path>
                            </svg>
                        </label>
                    </div>
                    <div class="flex flex-1 flex-row items-center">
                        <img class="w-12 h-12" src="icon.png" />
                        <a class="btn btn-ghost text-xl">HomeQuest</a>
                    </div>
                    <div class="hidden flex-none lg:block">
                        <ul class="menu menu-horizontal">
                            <!-- Navbar menu content here -->
                            <li><a>Navbar Item 1</a></li>
                            <li><a>Navbar Item 2</a></li>
                        </ul>
                    </div>
                </div>
            </div>
            <div class="drawer-side ">
                <label for="my-drawer-2" aria-label="close sidebar" class="drawer-overlay"></label>
                <ul class="menu bg-base-200 min-h-full w-80 p-4 flex">
                    <!-- Sidebar content here -->
                    <li><a><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                                stroke="currentColor" class="size-6">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
                            </svg>
                            Home</a></li>
                    <li><a><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                                stroke="currentColor" class="size-6">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M3.75 3v11.25A2.25 2.25 0 0 0 6 16.5h2.25M3.75 3h-1.5m1.5 0h16.5m0 0h1.5m-1.5 0v11.25A2.25 2.25 0 0 1 18 16.5h-2.25m-7.5 0h7.5m-7.5 0-1 3m8.5-3 1 3m0 0 .5 1.5m-.5-1.5h-9.5m0 0-.5 1.5M9 11.25v1.5M12 9v3.75m3-6v6" />
                            </svg>
                            Leaderboard</a></li>
                    <li class="flex-1"><a><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                stroke-width="1.5" stroke="currentColor" class="size-6">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M9 12.75 11.25 15 15 9.75m-3-7.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285Z" />
                            </svg>

                            Rewards</a></li>
                    <li><a>

                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                                stroke="currentColor" class="size-6">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15M12 9l-3 3m0 0 3 3m-3-3h12.75" />
                            </svg>
                            Logout
                            <div class="avatar">
                                <div class="w-8 rounded-full">
                                    <img src="https://api.dicebear.com/10.x/critters/svg?seed=Michael"
                                        alt="Tailwind-CSS-Avatar-component" />
                                </div>
                            </div>
                        </a></li>
                </ul>
            </div>
        </div>
    </header>
    <main class="mx-auto container py-4">
        <div class="card mx-auto bg-base-100 w-full max-w-sm shrink-0 bg-base-100 rounded-box border-base-300 border">
            <form class="card-body">
                <fieldset class="fieldset">
                    <label class="fieldset-label">Username</label>
                    <input type="username" class="input" placeholder="Username" required />
                    <p class="validator-hint hidden">Required</p>
                </fieldset>
                <fieldset class="fieldset">
                    <label class="fieldset-label">Passwort</label>
                    <input type="password" class="input" placeholder="Passwort" required />
                    <p class="validator-hint hidden">Required</p>
                </fieldset>
                <button type="submit" class="btn btn-primary mt-4">Einloggen</button>
                <a class="text-primary font-bold pt-2 text-center" href="#">Konto erstellen</a>
            </form>

        </div>

    </main>
</body>

<script>

</script>

</html>
