[package]
name = "homequest"
version = "0.1.0"
edition = "2024"
[lib]
name = "homequest"
path = "src/lib.rs"

[[bin]]
name = "homequest"
path = "src/main.rs"

[dependencies]
actix-files = "0.7.3"
actix-identity = "0.9.0"
actix-session = { version = "0.11.0", features = ["cookie-session"] }
actix-web = "4.18.1"
axum-test = { version = "21.1.0", features = ["actix-web"] }
config = "0.15.27"
env_logger = "0.11.11"
log = "0.4.35"
mockall = "0.15.0"
password-auth = "2.0.0"
playwright-rs = "0.21.0"
serde = "1.0.229"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite"] }
tera = { version = "2.4.0", features = ["glob_fs"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "tokio-macros"] }
tower-sessions = "0.15.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
