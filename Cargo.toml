[package]
name = "homequest"
version = "0.1.0"
edition = "2024"
[lib]
name = "homequest"
path = "src/lib.rs"

[[bin]]
name = "homequest"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", features = ["tokio"] }
axum-login = "0.18.0"
config = "0.15.27"
log = "0.4.35"
password-auth = "1.0.0"
serde = "1.0.229"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite"] }
tera = "2.4.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "tokio-macros"] }
tower-sessions = "0.15.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
