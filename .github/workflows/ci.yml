name: Rust

on:
  push:
    branches: [ "master" ]
    paths:
      - ".github/workflows/ci.yml"
      - ".cargo/**"
      - ".sqlx/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "rust-toolchain"
      - "rust-toolchain.toml"
      - "src/**/*.rs"
      - "tests/**/*.rs"
      - "migrations/**"
      - "templates/**"
      - "default_config.toml"
  pull_request:
    branches: [ "master" ]
    paths:
      - ".github/workflows/ci.yml"
      - ".cargo/**"
      - ".sqlx/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "rust-toolchain"
      - "rust-toolchain.toml"
      - "src/**/*.rs"
      - "tests/**/*.rs"
      - "migrations/**"
      - "templates/**"
      - "default_config.toml"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    - name: Build
      run: cargo build --verbose
    - name: Run library tests
      run: cargo test --verbose --lib
    - name: Install Playwright Browsers
      run: npx playwright@1.64.0 install chromium
    - name: Run e2e tests
      run: cargo test --test "*"
